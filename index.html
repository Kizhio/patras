<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patrás</title>
<meta name="description" content="Graba una frase, dale la vuelta, imítala y adivina. Juego de fiesta gratis: en un móvil o cada uno con el suyo.">
<meta name="theme-color" content="#4a1ba0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrás">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Creepster&family=Fredoka:wght@700&family=Mountains+of+Christmas:wght@700&family=Orbitron:wght@800&family=Pacifico&family=Pirata+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#140a1e;--bg2:#3a1a0a;--fg:#fff;--muted:#c9bfd6;--accent:#ff7a00;--accent2:#9dff3a;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hfont:var(--font);--r:22px;--glow:0 8px 30px -6px var(--accent);--cardshadow:none}
[data-theme=halloween]{--bg:#140a1e;--bg2:#3a1a0a;--accent:#ff7a00;--accent2:#9dff3a;--hfont:Creepster,cursive}
[data-theme=navidad]{--bg:#06281a;--bg2:#3a0b12;--accent:#ff3b4e;--accent2:#ffe9a8;--hfont:"Mountains of Christmas",cursive}
[data-theme=neon]{--bg:#05000f;--bg2:#24003d;--accent:#ff00e6;--accent2:#00f5ff;--hfont:Orbitron,sans-serif;--glow:0 0 16px var(--accent),0 0 40px var(--accent);--cardshadow:0 0 14px -4px var(--accent2),inset 0 0 20px -12px var(--accent2);--line:rgba(0,245,255,.35)}
[data-theme=arcade]{--bg:#000;--bg2:#15155a;--accent:#ffd400;--accent2:#ff3366;--font:"Courier New",monospace;--hfont:"Press Start 2P",monospace;--r:6px;--glow:4px 4px 0 var(--accent2);--cardshadow:4px 4px 0 var(--accent);--line:var(--accent2)}
[data-theme=oceano]{--bg:#021f3a;--bg2:#036f8a;--accent:#00d4ff;--accent2:#ffcf5c;--hfont:Pacifico,cursive}
[data-theme=espacio]{--bg:#000012;--bg2:#2a0b4f;--accent:#b388ff;--accent2:#ffe082;--hfont:Orbitron,sans-serif;--glow:0 0 24px var(--accent)}
[data-theme=bosque]{--bg:#0d2a12;--bg2:#3d5a1f;--accent:#ff9f43;--accent2:#c9f29b;--hfont:Fredoka,sans-serif}
[data-theme=kawaii]{--bg:#ffd6e8;--bg2:#d8e7ff;--fg:#4a2b4a;--muted:#8a6a8a;--accent:#ff6fae;--accent2:#5fb4ff;--card:rgba(255,255,255,.6);--line:rgba(255,111,174,.4);--hfont:Fredoka,sans-serif;--r:28px;--cardshadow:0 8px 24px -10px var(--accent)}
[data-theme=playa]{--bg:#ffb347;--bg2:#00b4d8;--fg:#1f2a44;--muted:#3b4a6b;--accent:#ff5e5b;--accent2:#fff176;--card:rgba(255,255,255,.45);--line:rgba(0,0,0,.12);--hfont:Pacifico,cursive}
[data-theme=fiesta]{--bg:#2b004f;--bg2:#ff2e63;--accent:#ffd700;--accent2:#08d9d6;--hfont:Bungee,sans-serif;--glow:0 0 24px var(--accent),0 0 60px -10px var(--accent2)}
[data-theme=pirata]{--bg:#141414;--bg2:#5a3814;--accent:#d4a84b;--accent2:#e74c3c;--font:Georgia,"Times New Roman",serif;--hfont:"Pirata One",cursive;--r:10px;--card:rgba(90,56,20,.45);--line:rgba(212,168,75,.5)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--fg);background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;transition:background .6s,color .6s}
#bg,#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg span{position:absolute;bottom:-60px;opacity:.5;animation:float linear infinite;filter:drop-shadow(0 0 8px rgba(0,0,0,.3))}
@keyframes float{to{transform:translateY(-120vh) rotate(360deg)}}
/* efectos por skin */
#fx i{position:absolute;display:block}
#fx .down{top:-40px;animation:down linear infinite}
@keyframes down{to{transform:translateY(115vh) rotate(300deg)}}
#fx .up{bottom:-40px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.5),transparent 60%);animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) translateX(30px)}}
#fx .tw{border-radius:50%;background:#fff;animation:tw ease-in-out infinite;box-shadow:0 0 8px #fff}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
#fx .fly{border-radius:50%;background:var(--accent2);box-shadow:0 0 12px 3px var(--accent2);animation:fly ease-in-out infinite alternate}
@keyframes fly{0%{opacity:.2;transform:translate(0,0)}50%{opacity:1}100%{opacity:.3;transform:translate(60px,-80px)}}
#fx .ct{width:10px;height:16px;top:-30px;animation:down linear infinite}
#fx.fog::before,#fx.fog::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 60%);filter:blur(30px);animation:drift 18s ease-in-out infinite alternate}
#fx.fog::after{right:-20vmax;bottom:-20vmax;animation-duration:25s;animation-direction:alternate-reverse}
#fx.fog::before{left:-20vmax;top:-10vmax}
@keyframes drift{to{transform:translate(25vw,10vh) scale(1.2)}}
#fx.grid::before{content:"";position:absolute;left:-50%;right:-50%;bottom:0;height:50%;background:repeating-linear-gradient(90deg,var(--accent2) 0 2px,transparent 2px 70px);transform:perspective(300px) rotateX(60deg);opacity:.35}
#fx.grid::after{content:"";position:absolute;left:-50%;right:-50%;bottom:0;height:50%;background:repeating-linear-gradient(0deg,var(--accent) 0 2px,transparent 2px 50px);transform:perspective(300px) rotateX(60deg);opacity:.5;animation:gridmove 1.2s linear infinite}
@keyframes gridmove{to{background-position:0 50px}}
#fx.scan::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)}
#fx.rays::before{content:"";position:absolute;width:220vmax;height:220vmax;top:-110vmax;right:-110vmax;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 7deg,transparent 7deg 16deg);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hero{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;font-size:76px;line-height:1;z-index:0;pointer-events:none;opacity:.9;filter:drop-shadow(0 0 18px var(--accent));animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
[data-theme=playa] #hero{animation:spin 40s linear infinite}
[data-theme=fiesta] #hero{animation:spin 6s linear infinite}
[data-theme=espacio] #hero{animation:bob 10s ease-in-out infinite}
#homebtn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);font-size:1.3rem;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px -4px #000}
#homebtn[hidden]{display:none}
#update{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;background:var(--accent2);color:#000;border-radius:999px;padding:10px 12px 10px 16px;font-weight:700;font-size:.95rem;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px -6px #000;animation:in .4s ease-out;white-space:nowrap;max-width:calc(100vw - 24px)}
#update[hidden]{display:none}
.roomrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.roomrow>span{flex:1;min-width:0}.roomrow small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomrow .btn{width:auto;margin:0;padding:10px 14px;font-size:.95rem}.roomrow .link{margin:0}
.fakebar{display:flex;align-items:center;gap:10px;background:#fff;color:#222;border-radius:999px;padding:8px 14px;margin:6px 0 14px;font-size:.95rem;box-shadow:0 4px 14px -4px #000}
.fakebar .tap{position:relative;font-weight:800;background:var(--accent2);color:#000;border-radius:999px;padding:4px 10px;animation:pulse 1.4s infinite}
.fakebar .tap i{position:absolute;left:0;top:110%;font-style:normal;font-size:.75rem;white-space:nowrap;color:var(--fg);text-shadow:0 1px 4px #000}
.fakebar .url{opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.2);border-radius:16px;padding:10px 12px;margin:8px 0;line-height:1.3}
.step>b{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;flex:none}
.step .si{font-size:1.5rem;flex:none;width:34px;text-align:center}
#update button{border:0;border-radius:999px;background:#000;color:#fff;font:inherit;font-weight:800;padding:8px 14px;cursor:pointer}
body.ingame #app{padding-top:calc(60px + env(safe-area-inset-top))}
body.chat #app{padding-bottom:96px}
#chat[hidden]{display:none}
#chatbtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);box-shadow:var(--glow);font-size:1.5rem;cursor:pointer}
#chatbtn b{position:absolute;top:-4px;right:-4px;background:#e3002b;color:#fff;border-radius:999px;font-size:.75rem;min-width:22px;padding:3px 6px}
#chatbtn b[hidden]{display:none}
#chatpanel{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:70vh;display:flex;flex-direction:column;background:var(--bg);border-top:2px solid var(--accent);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#chatpanel[hidden]{display:none}
#chatpanel header{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}
#chatpanel header .link{margin:0}
#chatlist{overflow-y:auto;flex:1;min-height:120px;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.msg{max-width:85%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:.95rem;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--accent);color:#000;border:0}
.msg small{display:block;font-size:.72rem;opacity:.7;font-weight:700;margin-bottom:2px}
.msg.vn{display:flex;align-items:center;gap:8px}
.msg.vn button{border:0;border-radius:50%;width:36px;height:36px;background:var(--accent2);color:#000;font-size:1rem;cursor:pointer;flex:none}
.msg.vn canvas{width:110px;height:34px;background:rgba(0,0,0,.2)}
#chatwave{height:50px;margin:4px 0}
#chatform{display:flex;gap:6px;margin-top:6px}
#chatform input{flex:1}
#chatform button{border:0;border-radius:50%;width:46px;height:46px;font-size:1.2rem;cursor:pointer;background:var(--accent2);color:#000;flex:none}
#chatform #chatmic.on{background:#e3002b;color:#fff;animation:pulse 1s infinite}
#wipe{position:fixed;left:50%;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%) scale(0);z-index:50;pointer-events:none;background:var(--accent)}
#wipe.go{animation:wipe .8s ease-out forwards}
@keyframes wipe{0%{transform:translate(-50%,-50%) scale(0);opacity:.95}60%{opacity:.7}100%{transform:translate(-50%,-50%) scale(200);opacity:0}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1,h2,h3{margin:0 0 8px;line-height:1.1}
h1{font-size:2.2rem;font-family:var(--hfont);text-shadow:0 2px 16px var(--accent)}
[data-theme=arcade] h1{font-size:1.3rem;line-height:1.5}
[data-theme=arcade] .logo{font-size:1.9rem}
.logo{font-size:3.2rem;text-align:center;text-shadow:0 0 24px var(--accent),0 0 60px var(--accent)}
.skinbtn .ic{filter:drop-shadow(0 0 10px var(--accent));background:linear-gradient(160deg,var(--accent),var(--bg2))}
.skinbtn small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:3px}
.skinbtn b{display:block;font-size:1.3rem;font-family:var(--hfont);text-shadow:0 0 12px var(--accent);line-height:1.1}
.skinbtn .pill{font-size:.9rem;opacity:1;background:var(--accent2);color:#000;border-radius:999px;padding:9px 14px;font-weight:800;box-shadow:0 4px 14px -4px var(--accent2)}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.skin{position:relative;border:3px solid transparent;border-radius:20px;padding:16px 10px 12px;min-height:150px;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden;transition:transform .15s;box-shadow:0 10px 30px -12px #000}
.skin:active{transform:scale(.96)}
.skin .sh{font-size:3rem;line-height:1;filter:drop-shadow(0 0 14px var(--accent));animation:bob 5s ease-in-out infinite}
.skin b{font-family:var(--hfont);font-size:1.15rem;text-shadow:0 0 12px var(--accent)}
[data-theme=arcade].skin b{font-size:.7rem}
.skin small{color:var(--muted);font-size:.75rem;text-align:center;line-height:1.2}
.skin::after{content:attr(data-e);position:absolute;right:6px;top:6px;font-size:1.3rem;opacity:.7}
.skin::before{content:attr(data-e2);position:absolute;left:8px;bottom:8px;font-size:1.1rem;opacity:.6}
.skin.on{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent),0 10px 30px -8px var(--accent);transform:scale(1.03)}
.skin.on i{position:absolute;left:0;right:0;bottom:0;background:var(--accent2);color:#000;font-style:normal;font-weight:800;font-size:.8rem;padding:3px}
.logoimg{display:block;width:min(240px,70vw);height:auto;margin:4px auto 10px;border-radius:22%;box-shadow:0 14px 50px -10px var(--accent),0 0 0 4px rgba(255,255,255,.08);animation:bob 7s ease-in-out infinite}
.ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 6px 16px -6px rgba(0,0,0,.6);flex:none}
.btn.mode,.btn.skinbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:26px;position:relative;overflow:hidden;margin:12px 0}
.btn.mode::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 35%,transparent 65%,rgba(255,255,255,.14));pointer-events:none}
.btn.mode b{display:block;font-size:1.25rem;font-family:var(--hfont);letter-spacing:.02em;line-height:1.15}
.btn.mode small{display:block;font-weight:500;font-size:.85rem;opacity:.85;margin-top:4px;line-height:1.3}
.btn.mode .ch{font-size:1.7rem;opacity:.75;line-height:1}
[data-theme=arcade] .btn.mode b,[data-theme=arcade] .skinbtn b{font-size:.8rem;line-height:1.5}
.tag{text-align:center;color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;backdrop-filter:blur(8px);box-shadow:var(--cardshadow)}
.card h2{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px 20px;font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer;background:var(--card);color:var(--fg);border:1px solid var(--line);margin:8px 0;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#000;border:0;box-shadow:var(--glow)}
.btn.alt{background:var(--accent2);color:#000;border:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px}.row .btn{flex:1}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--accent);color:#000;border-radius:999px;padding:6px 12px;font-weight:700;display:flex;gap:6px;align-items:center}
.chip.off{opacity:.45}
.chip b{cursor:pointer;opacity:.6}
form.add{display:flex;gap:8px}
input,select{font:inherit;font-size:1rem;padding:12px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.12);color:var(--fg);flex:1;min-width:0;width:100%}
input::placeholder{color:var(--muted)}
select{background:var(--card)}
select option{color:#000}
.opt{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:700}
.opt select{flex:1;width:auto}
.opt input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.opt small{font-weight:400;color:var(--muted)}
.center{text-align:center;padding-top:6vh}
.big{font-size:5rem;margin:0}
.code{font-size:3rem;letter-spacing:.3em;font-weight:900;text-align:center;color:var(--accent2);margin:6px 0}
.url{text-align:center;color:var(--muted);font-size:.85rem;word-break:break-all}
.phrase{font-size:1.5rem;font-weight:800;text-align:center;padding:14px;border-radius:16px;background:rgba(0,0,0,.25);border:2px dashed var(--accent2)}
input.phrase{font-size:1.25rem;color:var(--fg)}
canvas{width:100%;height:110px;display:block;border-radius:16px;background:rgba(0,0,0,.2)}
.rec{width:110px;height:110px;border-radius:50%;margin:14px auto;display:grid;place-items:center;font-size:2.6rem;font-weight:900;color:#000;border:6px solid var(--accent2);background:var(--accent);cursor:pointer;transition:all .2s;user-select:none}
.rec.on{animation:pulse 1s infinite;background:#e3002b;border-color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,0,43,.7)}100%{box-shadow:0 0 0 26px rgba(227,0,43,0)}}
.hint{color:var(--muted);text-align:center;font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:700;margin-bottom:8px;font-size:.9rem}
.score{display:flex;align-items:center;gap:10px;margin:8px 0}
.score .name{width:34%;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .bar{flex:1;height:24px;background:rgba(0,0,0,.25);border-radius:999px;overflow:hidden}
.score .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .8s}
.score .pts{width:40px;text-align:right;font-weight:800}
.guess{display:flex;flex-wrap:wrap;gap:8px}
.guess label{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;user-select:none}
.guess input{display:none}
.guess label:has(input:checked){background:var(--accent2);border-color:var(--accent2);color:#000}
.guess label small{opacity:.7;font-weight:400}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;display:block;margin:8px auto}
.err{background:#e3002b;color:#fff;padding:12px;border-radius:12px;display:block}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#confetti span{position:fixed;top:-40px;animation:fall 3s linear forwards;z-index:5;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:20px}
</style>
</head>
<body>
<div id="bg"></div><div id="fx"></div><div id="hero"></div><div id="wipe"></div>
<div id="confetti"></div>
<button id="homebtn" hidden title="Volver al inicio">🏠</button>
<div id="update" hidden>🆕 Hay una versión nueva de Patrás <button id="updbtn">Actualizar</button></div>
<div id="chat" hidden><button id="chatbtn" title="Chat de sala">💬<b id="chatn" hidden></b></button>
<section id="chatpanel" hidden><header>💬 Chat de sala <button class="link" id="chatclose">Cerrar ✕</button></header><div id="chatlist"></div><canvas id="chatwave" hidden></canvas>
<form id="chatform"><input id="chattext" placeholder="Escribe…" maxlength="200" autocomplete="off"><button type="submit" title="Enviar">➤</button><button type="button" id="chatmic" title="Nota de voz">🎤</button></form></section></div>
<main id="app"></main>
<script>
// n nombre · e emojis flotantes · h personaje · fx efecto de fondo · d descripción
const THEMES={

let AC,playing=null,rec=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function reverse(b){const o=ac().createBuffer(b.numberOfChannels,b.length,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)o.copyToChannel(Float32Array.from(b.getChannelData(c)).reverse(),c);return o}
function toPCM(b,rate=b.sampleRate){const d=b.getChannelData(0),k=b.sampleRate/rate,n=Math.floor(d.length/k),o=new Int16Array(n);for(let i=0;i<n;i++)o[i]=Math.max(-1,Math.min(1,d[Math.floor(i*k)]))*32767;return o.buffer}
function fromPCM(ab,rate){const u=ab instanceof ArrayBuffer?ab:ab.buffer.slice(ab.byteOffset,ab.byteOffset+ab.byteLength),i16=new Int16Array(u),b=ac().createBuffer(1,i16.length,rate),d=b.getChannelData(0);for(let i=0;i<i16.length;i++)d[i]=i16[i]/32767;return b}
function bars(cv){const c=cv.getContext('2d'),W=cv.width=cv.clientWidth*devicePixelRatio,H=cv.height=cv.clientHeight*devicePixelRatio;c.clearRect(0,0,W,H);const cs=getComputedStyle(document.body);return{W,H,a1:cs.getPropertyValue('--accent'),a2:cs.getPropertyValue('--accent2'),bar(x,w,h,col){c.fillStyle=col;c.beginPath();c.roundRect?c.roundRect(x,(H-h)/2,w,h,99):c.rect(x,(H-h)/2,w,h);c.fill()}}}
function drawWave(cv,buf,p=0){const g=bars(cv),d=buf.getChannelData(0),N=60,step=Math.floor(d.length/N),bw=g.W/N;for(let i=0;i<N;i++){let m=0;for(let j=0;j<step;j+=8){const v=Math.abs(d[i*step+j]);if(v>m)m=v}g.bar(i*bw+bw*.15,bw*.7,Math.max(4,Math.min(g.H,m*g.H*1.8)),i/N<p?g.a2:g.a1)}}
function drawLive(cv,data){const g=bars(cv),N=60,step=Math.floor(data.length/N),bw=g.W/N;for(let i=0;i<N;i++){let m=0;for(let j=0;j<step;j++){const v=Math.abs(data[i*step+j]-128)/128;if(v>m)m=v}g.bar(i*bw+bw*.15,bw*.7,Math.max(4,m*g.H*2),'#fff')}}
async function startRec(cv){const stream=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=ac(),mr=new MediaRecorder(stream),chunks=[];mr.ondataavailable=e=>chunks.push(e.data);const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=512;src.connect(an);const data=new Uint8Array(an.fftSize);let raf;const draw=()=>{an.getByteTimeDomainData(data);drawLive(cv,data);raf=requestAnimationFrame(draw)};draw();mr.start();
 rec={stop:()=>new Promise((res,rej)=>{mr.onstop=async()=>{cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());src.disconnect();try{res(await ctx.decodeAudioData(await new Blob(chunks,{type:mr.mimeType}).arrayBuffer()))}catch(e){rej(e)}};mr.stop()})}}
function play(buf,cv){return new Promise(res=>{const ctx=ac();if(playing){try{playing.stop()}catch(e){}}const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);const t0=ctx.currentTime;playing=s;let raf;const tick=()=>{drawWave(cv,buf,(ctx.currentTime-t0)/buf.duration);raf=requestAnimationFrame(tick)};tick();s.onended=()=>{cancelAnimationFrame(raf);drawWave(cv,buf,1);if(playing===s)playing=null;res()};s.start()})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function recorderUI(done){ // cuenta atrás 3-2-1, tope de MAXSEC segundos, toca para parar antes
 const cv=$('#wave'),btn=$('#rec'),st=$('#status');let timer,tick,busy=false;
 const reset=()=>{clearTimeout(timer);clearInterval(tick);btn.classList.remove('on');btn.textContent='🎙️'};
 const fail=e=>{rec=null;reset();st.innerHTML=`<span class="err">No puedo usar el micrófono. Permite el acceso y abre la página por HTTPS. (${esc(e.message||e)})</span>`};
 const stop=async()=>{if(!rec)return;const r=rec;rec=null;reset();try{const buf=await r.stop();if(buf.duration<.4){st.textContent='Muy corto, prueba otra vez';return}drawWave(cv,buf);st.textContent=buf.duration.toFixed(1)+' s grabados';done(buf)}catch(e){fail(e)}};
 btn.onclick=async()=>{if(rec)return stop();if(busy)return;busy=true;try{for(const n of[3,2,1]){btn.textContent=n;st.textContent='Prepárate…';await sleep(600)}await startRec(cv);btn.classList.add('on');btn.textContent='⏹';let left=MAXSEC;st.textContent=`Grabando… ${left} s (toca para parar)`;tick=setInterval(()=>{left--;st.textContent=`Grabando… ${left} s (toca para parar)`},1000);timer=setTimeout(stop,MAXSEC*1000)}catch(e){fail(e)}finally{busy=false}};
 return cv;
}
// Pide el micrófono al empezar (con gesto del usuario); si se deniega, explica cómo activarlo y deja reintentar
async function micGate(next){
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());return next()}
 catch(e){const noDev=/NotFound|Devices/i.test(e.name||'');
  // Estado real del permiso: 'prompt' = volverá a preguntar; 'denied' = bloqueado, solo el usuario puede cambiarlo en Ajustes
  let state='unknown';try{state=(await navigator.permissions.query({name:'microphone'})).state}catch(x){}
  const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),android=/android/i.test(ua),inst=standalone();
  // Guía visual: barra de direcciones de mentira con el candado señalado + pasos como tarjetas
  const bar=(icon,txt)=>`<div class="fakebar"><span class="tap">${icon}<i>👆 toca aquí</i></span><span class="url">${txt}</span></div>`;
  const step=(n,icon,t)=>`<div class="step"><b>${n}</b><span class="si">${icon}</span><span>${t}</span></div>`;
  const guide=ios?(inst?[step(1,'⚙️','Abre <b>Ajustes</b> del iPhone'),step(2,'⏪','Baja y entra en <b>Patrás</b>'),step(3,'🎤','Activa el interruptor <b>Micrófono</b>')]
     :[bar('AA','kizhio.github.io/patras'),step(1,'AA','Toca <b>AA</b> a la izquierda de la dirección'),step(2,'⚙️','<b>Ajustes del sitio web</b>'),step(3,'🎤','<b>Micrófono</b> → <b>Permitir</b>')])
    :android?(inst?[`<a class="btn alt" style="text-decoration:none" href="intent://kizhio.github.io/patras/?permiso=1#Intent;scheme=https;package=com.android.chrome;end">🌐 Abrir en Chrome para dar permiso</a>`,step(1,'🔒','En Chrome, toca el <b>candado</b> junto a la dirección → <b>Permisos</b> → <b>Micrófono</b> → <b>Permitir</b>'),step(2,'⏪','Vuelve a la app Patrás y pulsa <b>Volver a intentarlo</b>'),`<p class="hint" style="margin:10px 0 0">O bien: Ajustes de Android → Aplicaciones → Patrás → Permisos → Micrófono.</p>`]
     :[bar('🔒','kizhio.github.io/patras'),step(1,'🔒','Toca el <b>candado</b> junto a la dirección'),step(2,'🎤','<b>Permisos</b> → <b>Micrófono</b>'),step(3,'✅','Elige <b>Permitir</b>')])
    :[bar('🔒','kizhio.github.io/patras'),step(1,'🔒','Haz clic en el <b>candado</b> a la izquierda de la dirección'),step(2,'🎤','Pon <b>Micrófono</b> en <b>Permitir</b>')];
  const steps=noDev?'':state!=='denied'?`<p class="hint">Pulsa <b>Volver a intentarlo</b> y, cuando aparezca la pregunta, elige <b>Permitir</b>.</p>`
   :`<div class="card" style="text-align:left"><p style="margin:0 0 10px"><b>El micrófono está bloqueado para Patrás.</b> Actívalo así y vuelve: la app lo detecta sola.</p>${guide.join('')}</div>`;
  app.innerHTML=`<div class="center"><p class="big">🎤</p><h2>${noDev?'No encuentro ningún micrófono':'Necesito el micrófono'}</h2><p class="hint">${noDev?'Este dispositivo no tiene micrófono disponible o lo está usando otra app.':'Sin micrófono no se puede grabar ni imitar.'}</p>${steps}
  <button class="btn primary" id="retry">🔁 Volver a intentarlo</button><button class="link" id="skip">Seguir sin probar ahora</button></div>`;
  $('#retry').onclick=()=>micGate(next);$('#skip').onclick=next}
}

const save=()=>localStorage.setItem('players',JSON.stringify(S.players));
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const saveRoom=(code,name)=>LS.set('rooms',[{code,name:name||'',ts:Date.now()},...LS.get('rooms',[]).filter(r=>r.code!==code)].slice(0,8));

const fecha=ts=>new Date(ts).toLocaleDateString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

/* ---------- modo un móvil ---------- */
function startGame(){S.gid=Date.now();S.turn=0;S.total=OPTS.vueltas*S.players.length;S.scores=Object.fromEntries(S.players.map(p=>[p,0]));nextTurn()}
function nextTurn(){if(S.turn>=S.total)return final();const n=S.players.length;S.rec=S.players[S.turn%n];S.imi=S.players[(S.turn+1)%n];S.orig=S.imit=null;S.phrase=pick(OPTS.cat);pass(S.rec,'🎙️ Te toca grabar la frase secreta. ¡Que nadie te oiga!',screenRecord)}
function pass(name,msg,next){app.innerHTML=`<div class="center"><p class="big">📱</p><h2>Pasa el móvil a</h2><h1>${esc(name)}</h1><p class="hint">${msg}</p><button class="btn primary" id="go">Soy ${esc(name)} ✋</button></div>`;$('#go').onclick=next}
const hdr=(turn,total,rec,imi)=>`<div class="top"><span>Turno ${turn+1}/${total}</span><span>🎙️ ${esc(rec)} · 🎭 ${esc(imi)}</span></div>`;

 <div id="after" style="display:none"><div class="row"><button class="btn" id="pn">▶ Normal</button><button class="btn" id="pr">⏪ Al revés</button></div><button class="btn primary" id="ok">✅ Listo, pasar a ${esc(S.imi)}</button></div>`;

function screenReveal(){
 const others=S.players.filter(p=>p!==S.rec); // quien imita también adivina
 app.innerHTML=`${hdr(S.turn,S.total,S.rec,S.imi)}<h1>🔊 Momento de la verdad</h1><p class="hint">Esto es la imitación de ${esc(S.imi)}… <b>dada la vuelta</b>. ${esc(S.imi)} dice primero su respuesta y luego el resto. ¿Qué frase dijo ${esc(S.rec)}?</p>

 <button class="btn alt" id="next">Puntuar y seguir ▶</button>`;
 const cv=$('#wave'),ri=reverse(S.imit);drawWave(cv,ri);
 $('#p1').onclick=()=>play(ri,cv);$('#show').onclick=()=>{$('#orig').style.display='block';$('#show').style.display='none'};$('#p2').onclick=()=>play(S.orig,cv);
 $('#next').onclick=()=>{const g=[...document.querySelectorAll('.guess input:checked')].map(i=>i.value);applyScores(S.scores,g,S.rec,S.imi);S.turn++;scoreboard(g.length)};

function scoreboard(hits){

 animateBars();$('#go').onclick=nextTurn;$('#quit').onclick=final;
}
function final(){
 saveHist(S.gid,'local',S.scores);confetti();const [w]=Object.entries(S.scores).sort((a,b)=>b[1]-a[1]);
 app.innerHTML=`<div class="center"><p class="big">🏆</p><h2>Gana</h2><h1>${esc(w[0])}</h1></div><div class="card">${scoreTable(S.scores)}</div><button class="btn primary" id="again">🔁 Otra partida</button><button class="btn" id="home">🏠 Inicio</button>`;
 animateBars();$('#again').onclick=startGame;$('#home').onclick=home;

function roomsUI(){const R=LS.get('rooms',[]),C=LS.get('recent',[]).filter(c=>!R.some(r=>r.code===c.code));if(!R.length&&!C.length)return'';
 return`<section class="card"><h2>🌐 Tus salas</h2>${R.map(r=>`<div class="roomrow"><span><b>${esc(r.name||'Sala '+r.code)}</b><small>Código ${r.code} · creada por ti · ${fecha(r.ts)}</small></span><button class="btn alt" data-open="${r.code}">Reabrir</button><button class="link" data-del="${r.code}" title="Olvidar">✕</button></div>`).join('')}

 document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>me?micGate(()=>joinRoom(me,b.dataset.join)):onlineHome(b.dataset.join));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{LS.set('rooms',LS.get('rooms',[]).filter(x=>x.code!==b.dataset.del));re()});

}

 ${h.length?'<button class="link" id="clear">Borrar historial</button>':''}<button class="btn" id="back">← Volver</button>`;

}

/* ---------- modo online (WebRTC vía PeerJS, sin servidor propio) ---------- */
// ponytail: sin TURN; si una red muy cerrada no conecta, pasar {config:{iceServers:[...]}} a new Peer.
// Reconexión: los jugadores reintentan solos y pueden recargar la página; si se cae el ANFITRIÓN la sala se pierde.
let N=null; // {me, host, peer, conns:Map, hostConn, G:estado compartido, A:{orig,imit} AudioBuffers, P:{orig,imit} PCM crudo (anfitrión)}
const mkCode=()=>Array.from({length:4},()=>rand([...'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'])).join('');
const roomURL=c=>location.origin+location.pathname+'?sala='+c;
const status=m=>{const s=$('#st');if(s)s.innerHTML=`<span class="err">${esc(m)}</span>`};
const errScreen=m=>{sessionStorage.removeItem('room');app.innerHTML=`<p class="err">${esc(m)}</p><button class="link" id="b">← Volver</button>`;$('#b').onclick=()=>onlineHome()};
function onlineHome(code=''){
 const saved=localStorage.getItem('me')||'';
 if(code&&saved)return joinRoom(saved,code);
 app.innerHTML=`<h1>📱📱 Cada uno con su móvil</h1><p class="hint">Desde 2 jugadores, juntos o a distancia. Uno crea la sala y comparte el enlace o el código.</p>
 <div class="card"><input id="me" placeholder="Tu nombre" maxlength="14" autocomplete="off" value="${esc(saved)}"></div>
 ${code?'':'<div class="card"><input id="rname" placeholder="Nombre de la sala (opcional, p. ej. Los viernes)" maxlength="24" autocomplete="off"></div><button class="btn primary" id="host">➕ Crear sala</button>'}
 <div class="card"><form class="add" id="joinf"><input id="code" placeholder="CÓDIGO" maxlength="4" autocomplete="off" value="${esc(code)}" style="text-transform:uppercase;letter-spacing:.2em"><button class="btn alt" style="width:auto;margin:0">Unirse</button></form></div>
 <p id="st"></p><button class="link" id="back">← Volver</button>`;
 const me=()=>{const v=$('#me').value.trim();if(!v){status('Pon tu nombre');return null}localStorage.setItem('me',v);return v};
 const h=$('#host');if(h)h.onclick=()=>{const m=me(),rn=$('#rname').value.trim();if(m)micGate(()=>hostRoom(m,'',rn))};
 $('#joinf').onsubmit=e=>{e.preventDefault();const m=me(),c=$('#code').value.trim().toUpperCase();if(m&&c.length===4)micGate(()=>joinRoom(m,c))};
 $('#back').onclick=home;if(code)$('#me').focus();
}
function waitScreen(icon,msg){app.innerHTML=`<div class="center"><p class="big">${icon}</p><h2>${msg}</h2><p class="hint"><span class="spin">⏳</span> Mientras tanto, nada de trampas…</p></div>`}
function send(m){N.host?handle(null,m):N.hostConn.send(m)}
function hostRoom(me,code,name){ // code: reabrir una sala guardada con su mismo código
 const c=code||mkCode(),peer=new Peer('rebobina-'+c);
 N={me,host:true,peer,conns:new Map(),A:{},P:{},G:{phase:'lobby',code:c,name:name||'',players:[me],scores:{},turn:0,total:0,guesses:[],...OPTS}};
 waitScreen('📡','Creando sala…');
 peer.on('open',()=>{saveRoom(c,name);renderOnline()});
 peer.on('disconnected',()=>{if(N&&N.peer===peer)peer.reconnect()});
 peer.on('error',e=>e.type==='unavailable-id'?(code?(N=null,app.innerHTML=`<div class="center"><p class="big">🚧</p><h2>El código ${esc(code)} está en uso ahora mismo</h2><p class="hint">Otro grupo tiene abierta una sala con ese código. Puedes crear la sala con un código nuevo (tendrás que compartir el enlace otra vez).</p><button class="btn primary" id="newc">Crear con otro código</button><button class="link" id="b">← Volver</button></div>`,$('#newc').onclick=()=>hostRoom(me,'',name),$('#b').onclick=home):hostRoom(me,'',name)):e.type==='peer-unavailable'?0:errScreen(`No se pudo crear la sala (${e.type}). Revisa tu conexión.`));
 peer.on('connection',conn=>{conn.on('data',m=>handle(conn,m));conn.on('close',()=>{if(!N||!conn.name||N.conns.get(conn.name)!==conn)return;N.conns.delete(conn.name);if(N.G.phase==='lobby')N.G.players=N.G.players.filter(p=>p!==conn.name);bcast()})});
}
function joinRoom(me,c,retry=0){
 const peer=new Peer();N={me,host:false,peer,A:{},G:retry?N?.G:null};
 waitScreen('📡',retry?`Reconectando… (intento ${retry})`:'Conectando a la sala '+c+'…');
 let done=false;const again=()=>{if(done||!N||N.peer!==peer)return;done=true;peer.destroy();if(retry>=6)return errScreen('No consigo conectar con la sala. ¿Sigue abierta en el móvil del anfitrión?');setTimeout(()=>joinRoom(me,c,retry+1),1500*(retry+1))};
 peer.on('open',()=>{const conn=peer.connect('rebobina-'+c,{reliable:true});N.hostConn=conn;
  conn.on('open',()=>{conn.send({t:'join',name:me});sessionStorage.setItem('room',JSON.stringify({me,c}));saveRecent(c);retry=0});
  conn.on('data',m=>{if(m.t==='state'){if(m.G.phase==='record'&&N.G?.phase!=='record')N.A={};N.G=m.G;renderOnline()}else if(m.t==='audio'){N.A[m.kind]=fromPCM(m.data,m.rate);renderOnline()}else if(m.t==='chat'){addChat(m)}else if(m.t==='err'){N=null;peer.destroy();errScreen(m.msg)}});
  conn.on('close',again);conn.on('error',again)});
 peer.on('error',e=>e.type==='peer-unavailable'&&!retry?errScreen('No existe ninguna sala con ese código.'):again());
}
function bcast(){for(const c of N.conns.values())c.send({t:'state',G:N.G});renderOnline()}
function sendAudio(kind,to){if(!N.P[kind]||!to)return;const m={t:'audio',kind,data:N.P[kind].data,rate:N.P[kind].rate};to==='all'?N.conns.forEach(c=>c.send(m)):to.send(m)}
function newTurn(){const G=N.G,n=G.players.length;G.rec=G.players[G.turn%n];G.imi=G.players[(G.turn+1)%n];G.phrase=pick(G.cat);G.guesses=[];G.phase='record';N.A={};N.P={}}
function handle(conn,m){ // solo en el anfitrión
 const G=N.G,from=conn?conn.name:N.me;
 if(m.t==='join'){
  if(G.phase!=='lobby'){ // reconexión de alguien que ya estaba
   if(!G.players.includes(m.name))return conn.send({t:'err',msg:'La partida ya ha empezado'});
   conn.name=m.name;N.conns.set(m.name,conn);conn.send({t:'state',G});
   if(G.phase==='imitate'&&G.imi===m.name)sendAudio('orig',conn);if(G.phase==='reveal')sendAudio('imit',conn);return renderOnline()}
  const dup=G.players.find(p=>p.toLowerCase()===m.name.toLowerCase());
  if(dup===N.me||(dup&&dup!==m.name))return conn.send({t:'err',msg:'Ese nombre ya está en la sala'});
  if(!dup&&G.players.length>=MAX)return conn.send({t:'err',msg:'Sala llena (10)'});
  const old=N.conns.get(m.name);if(old&&old!==conn)old.close(); // misma persona volviendo a entrar
  conn.name=m.name;N.conns.set(m.name,conn);if(!dup)G.players.push(m.name);return bcast()}

 if(m.t==='start'){G.gid=Date.now();Object.assign(G,m.opts);G.total=G.vueltas*G.players.length;G.turn=0;G.scores=Object.fromEntries(G.players.map(p=>[p,0]));newTurn();return bcast()}
 if(m.t==='audio'){N.P[m.kind]={data:m.data,rate:m.rate};N.A[m.kind]=fromPCM(m.data,m.rate);
  if(m.kind==='orig'){G.phrase=m.phrase||G.phrase;G.phase='imitate';if(G.imi!==N.me)sendAudio('orig',N.conns.get(G.imi))}
  else{G.phase='reveal';G.guesses=[];sendAudio('imit','all')}
  return bcast()}
 if(m.t==='guess'){if(G.phase==='reveal'&&!G.guesses.some(g=>g.name===from))G.guesses.push({name:from,text:m.text});return bcast()}
 if(m.t==='mark'){if(G.phase!=='reveal')return;applyScores(G.scores,m.correct,G.rec,G.imi);G.hits=m.correct.length;G.turn++;G.phase='score';return bcast()}
 if(m.t==='next'){if(G.turn>=G.total)G.phase='final';else newTurn();return bcast()}
 if(m.t==='again'){G.phase='lobby';G.players=G.players.filter(p=>p===N.me||N.conns.has(p));return bcast()}
 if(m.t==='chat'){const msg={t:'chat',from,ts:Date.now(),text:m.text,data:m.data,rate:m.rate};N.conns.forEach(c=>c.send(msg));return addChat(msg)}
}
async function share(url){const text=`Únete a mi sala de Patrás ⏪ ${url}`;if(navigator.share){try{await navigator.share({title:'Patrás',text,url})}catch(e){}return}try{await navigator.clipboard.writeText(url)}catch(e){}window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
function renderOnline(){
 const G=N&&N.G;if(!G)return;const me=N.me,H=N.host,isRec=me===G.rec,isImi=me===G.imi;
 const back=`<button class="link" id="leave">Salir de la sala</button>`,bindBack=()=>{const b=$('#leave');if(b)b.onclick=()=>{const p=N.peer;N=null;sessionStorage.removeItem('room');p.destroy();home()}};
 if(G.phase==='lobby'){
  const url=roomURL(G.code);
  app.innerHTML=`<h1>🌐 ${esc(G.name||'Sala')}</h1><div class="code">${G.code}</div><p class="url">${esc(url)}</p><button class="btn alt" id="share">📲 Compartir enlace</button><p class="hint">Jugadores: ${G.players.length}/${MAX}</p>
  <div class="card"><div class="players">${G.players.map(p=>`<span class="chip">${esc(p)}${p===me?' (tú)':''}</span>`).join('')}</div></div>
  ${H?`${optsUI(G)}<button class="btn primary" id="start" ${G.players.length<MIN?'disabled':''}>Empezar ▶ ${G.players.length<MIN?'(mínimo '+MIN+')':''}</button>`:'<p class="hint"><span class="spin">⏳</span> Esperando a que el anfitrión empiece…</p>'}
  ${skinBtn()}${back}`;
  $('#share').onclick=()=>share(url);bindSkin(renderOnline);bindBack();
  if(H){bindOpts(G);$('#start').onclick=()=>{Object.assign(OPTS,{vueltas:G.vueltas,cat:G.cat,pistas:G.pistas});localStorage.setItem('opts',JSON.stringify(OPTS));send({t:'start',opts:{vueltas:G.vueltas,cat:G.cat,pistas:G.pistas}})}}
  return}
 const th=hdr(G.turn,G.total,G.rec,G.imi);
 if(G.phase==='record'){
  if(!isRec)return waitScreen('🎙️',esc(G.rec)+' está grabando una frase…');
  app.innerHTML=`${th}<h1>🎙️ Graba tu frase</h1>${phraseBox(G.pistas,G.phrase)}${recordBlock('Toca para grabar (2-4 segundos)')}
  <div id="after" style="display:none"><div class="row"><button class="btn" id="pn">▶ Normal</button><button class="btn" id="pr">⏪ Al revés</button></div><button class="btn primary" id="ok">✅ Enviar a ${esc(G.imi)}</button></div>`;
  const o=$('#other');if(o)o.onclick=()=>{$('#ph').value=pick(G.cat)};
  let b;const cv=recorderUI(x=>{b=x;$('#after').style.display='block'});
  $('#pn').onclick=()=>play(b,cv);$('#pr').onclick=()=>play(reverse(b),cv);
  $('#ok').onclick=()=>{const p=readPhrase();if(!p)return;$('#ok').disabled=true;send({t:'audio',kind:'orig',data:toPCM(b),rate:b.sampleRate,phrase:p});if(!H)waitScreen('📤','Enviado. Ahora imita '+esc(G.imi)+'…')};
  return}
 if(G.phase==='imitate'){
  if(!isImi)return waitScreen('🎭',esc(G.imi)+' está imitando el sonido…');
  if(!N.A.orig)return waitScreen('📥','Recibiendo el audio…');
  const rev=reverse(N.A.orig);
  app.innerHTML=`${th}<h1>🎭 Imita el sonido</h1><p class="hint">Escúchalo las veces que quieras y grábate repitiéndolo <b>tal cual suena</b>. Después oye tu imitación <b>al revés</b>: lo que entiendas es tu respuesta.</p><canvas id="wave"></canvas><button class="btn alt" id="listen">🔊 Escuchar al revés</button><div class="rec" id="rec">🎙️</div><p class="hint" id="status">Toca para grabar tu imitación</p>
  <div id="after" style="display:none"><button class="btn alt" id="prr">⏪ Oír mi imitación al revés</button><div class="row"><button class="btn" id="pn">▶ Normal</button><button class="btn" id="re">🎙️ Repetir</button></div><button class="btn primary" id="ok">✅ Enviar a todos</button></div>`;
  let b;const cv=recorderUI(x=>{b=x;$('#after').style.display='block'});
  $('#listen').onclick=()=>play(rev,cv);$('#pn').onclick=()=>play(b,cv);$('#prr').onclick=()=>play(reverse(b),cv);$('#re').onclick=()=>$('#rec').click();
  $('#ok').onclick=()=>{$('#ok').disabled=true;send({t:'audio',kind:'imit',data:toPCM(b),rate:b.sampleRate});if(!H)waitScreen('📤','Enviado…')};
  return}
 if(G.phase==='reveal'){
  if(!N.A.imit)return waitScreen('📥','Recibiendo la imitación…');
  const ri=reverse(N.A.imit),mine=G.guesses.find(g=>g.name===me);
  const list=G.guesses.length?G.guesses.map(g=>`<div><b>${esc(g.name)}:</b> ${esc(g.text)}</div>`).join(''):'<p class="hint">Aún no hay respuestas…</p>';
  app.innerHTML=`${th}<h1>🔊 Momento de la verdad</h1><p class="hint">La imitación de ${esc(G.imi)}, <b>dada la vuelta</b>. ${isImi?'Escribe lo que entiendes: es tu respuesta.':'¿Qué frase dijo '+esc(G.rec)+'?'}</p><canvas id="wave"></canvas><button class="btn primary" id="p1">🔁 Reproducir</button>
  ${isRec?`<div class="card"><div class="phrase">${esc(G.phrase)}</div><p class="hint">Tu frase. Marca quién acertó:</p><div class="guess">${G.guesses.map(g=>`<label><input type="checkbox" value="${esc(g.name)}"><span>${esc(g.name)} <small>«${esc(g.text)}»</small></span></label>`).join('')||'<p class="hint">Esperando respuestas…</p>'}</div><button class="btn alt" id="mark">Puntuar ▶</button></div>`
   :`<div class="card"><h2>¿Qué frase era?</h2>${mine?`<p>Tu respuesta: <b>${esc(mine.text)}</b></p>`:`<form class="add" id="gf"><input id="gt" placeholder="Escribe tu respuesta" maxlength="60" autocomplete="off"><button class="btn primary" style="width:auto;margin:0">➤</button></form>`}${list}</div>`}`;
  const cv=$('#wave');drawWave(cv,ri);$('#p1').onclick=()=>play(ri,cv);
  const gf=$('#gf');if(gf)gf.onsubmit=e=>{e.preventDefault();const t=$('#gt').value.trim();if(t)send({t:'guess',text:t})};
  const mk=$('#mark');if(mk)mk.onclick=()=>send({t:'mark',correct:[...document.querySelectorAll('.guess input:checked')].map(i=>i.value)});
  return}
 if(G.phase==='score'){
  if(G.hits)confetti();
  app.innerHTML=`<h1>📊 Marcador</h1><p class="hint">${G.hits?`¡${G.hits} acierto${G.hits>1?'s':''}! 🎉`:'Nadie lo pilló… 😅'}</p><div class="card">${scoreTable(G.scores)}</div>${H?`<button class="btn primary" id="next">${G.turn>=G.total?'🏆 Resultado final':'Siguiente turno ▶'}</button>`:'<p class="hint"><span class="spin">⏳</span> El anfitrión pasa al siguiente turno…</p>'}`;
  animateBars();if(H)$('#next').onclick=()=>send({t:'next'});return}
 if(G.phase==='final'){
  saveHist(G.gid,'online',G.scores);confetti();const [w]=Object.entries(G.scores).sort((a,b)=>b[1]-a[1]);
  app.innerHTML=`<div class="center"><p class="big">🏆</p><h2>Gana</h2><h1>${esc(w[0])}</h1></div><div class="card">${scoreTable(G.scores)}</div>${H?`<button class="btn primary" id="again">🔁 Otra partida</button>`:''}${back}`;
  animateBars();bindBack();if(H)$('#again').onclick=()=>send({t:'again'})}
}

/* ---------- chat de sala (texto y notas de voz; solo online, se reenvía por el anfitrión) ---------- */
// ponytail: sin historial para quien entra tarde; el chat vive solo mientras dura la sala
const CH={open:false,unread:0,list:[]};
function addChat(m){if(!N)return;if(m.data)m.buf=fromPCM(m.data,m.rate);m.played=m.from===N.me;CH.list.push(m);if(CH.list.length>100)CH.list.shift();if(!CH.open&&m.from!==N.me)CH.unread++;renderChat();playPending()}
function playNote(m){m.played=true;const cv=document.querySelector(`[data-ts="${m.ts}"] canvas`)||document.createElement('canvas');return play(m.buf,cv).then(renderChat)}
// Las notas solo suenan si el audio está desbloqueado (hace falta un toque del usuario, sobre todo en iPhone); si no, quedan pendientes
function playPending(){if(!N||!AC||AC.state!=='running'||playing)return;const m=CH.list.find(x=>x.buf&&!x.played);if(m)playNote(m).then(playPending)}
document.addEventListener('pointerdown',()=>{if(N)ac().resume().then(playPending)},true);
function renderChat(){
 const box=$('#chat');if(!N){box.hidden=true;document.body.classList.remove('chat');CH.list=[];CH.unread=0;CH.open=false;return}
 box.hidden=false;document.body.classList.add('chat');const n=$('#chatn');n.hidden=!CH.unread;n.textContent=CH.unread;
 $('#chatpanel').hidden=!CH.open;if(!CH.open)return;
 const L=$('#chatlist');L.innerHTML=CH.list.map(m=>`<div class="msg ${m.from===N.me?'me':''} ${m.buf?'vn':''}" data-ts="${m.ts}"><div><small>${esc(m.from)}</small>${m.buf?'':esc(m.text)}</div>${m.buf?`<button data-p="${m.ts}">▶</button><canvas></canvas><span>${m.played?m.buf.duration.toFixed(0)+' s':'🔊 toca para oír'}</span>`:''}</div>`).join('')||'<p class="hint">Aún no hay mensajes. ¡Di algo!</p>';
 if(CH.list.some(m=>m.buf))L.insertAdjacentHTML('beforeend','<p class="hint" style="font-size:.78rem">¿No se oye? Sube el volumen multimedia y quita el modo silencio del móvil.</p>');
 CH.list.filter(m=>m.buf).forEach(m=>{const c=document.querySelector(`[data-ts="${m.ts}"] canvas`);if(c)drawWave(c,m.buf)});
 L.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const m=CH.list.find(x=>String(x.ts)===b.dataset.p);m.played=true;ac();play(m.buf,b.nextElementSibling)});
 L.scrollTop=L.scrollHeight;
}
$('#chatbtn').onclick=()=>{CH.open=true;CH.unread=0;renderChat();$('#chattext').focus()};
$('#chatclose').onclick=()=>{CH.open=false;renderChat()};
$('#chatform').onsubmit=e=>{e.preventDefault();const t=$('#chattext').value.trim();if(!t||!N)return;$('#chattext').value='';send({t:'chat',text:t})};
$('#chatmic').onclick=async()=>{ // toca para grabar, toca para enviar (máx. 10 s)
 const b=$('#chatmic'),cv=$('#chatwave');
 if(b.classList.contains('on')){clearTimeout(b.timer);const r=rec;rec=null;b.classList.remove('on');cv.hidden=true;try{const buf=await r.stop();if(buf.duration>=.4)send({t:'chat',data:toPCM(buf,16000),rate:16000})}catch(e){}return}
 if(rec)return;try{cv.hidden=false;await startRec(cv);b.classList.add('on');b.timer=setTimeout(()=>b.onclick(),10000)}catch(e){cv.hidden=true;alert('No puedo usar el micrófono: '+(e.message||e))}
};

/* ---------- botón de inicio (todas las pantallas menos el inicio) ---------- */
function leave(){
 const inGame=!!N||(S.total>0&&S.turn<S.total);
 if(inGame&&!confirm(N&&N.host?'Eres el anfitrión: si sales, la sala se cierra para todos. ¿Volver al inicio?':'Se perderá la partida en curso. ¿Volver al inicio?'))return;
 if(N){const p=N.peer;N=null;sessionStorage.removeItem('room');p.destroy()}
 if(rec){rec.stop().catch(()=>{});rec=null}if(playing){try{playing.stop()}catch(e){}}
 S.total=0;home();
}
$('#homebtn').onclick=leave;
new MutationObserver(()=>{const isHome=!!app.querySelector('.logoimg');$('#homebtn').hidden=isHome;document.body.classList.toggle('ingame',!isHome);renderChat()}).observe(app,{childList:true});

/* ---------- aviso de actualización: compara la huella (ETag) del index publicado con la cargada ---------- */
let VER=null;
async function checkUpdate(){try{const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});const v=r.headers.get('etag')||r.headers.get('last-modified');if(!v)return;if(VER===null)VER=v;else if(v!==VER)$('#update').hidden=false}catch(e){}}
checkUpdate();setInterval(checkUpdate,5*60*1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
$('#updbtn').onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}location.reload()};

/* ---------- arranque ---------- */
setTheme(THEMES[localStorage.getItem('theme')]?localStorage.getItem('theme'):'halloween');
const salaURL=(new URLSearchParams(location.search).get('sala')||'').toUpperCase().slice(0,4);
const room=JSON.parse(sessionStorage.getItem('room')||'null');
if(room)joinRoom(room.me,room.c,1);else if(salaURL.length===4)onlineHome(salaURL);else home();
</script>
